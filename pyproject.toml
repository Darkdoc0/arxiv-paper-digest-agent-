[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-paper-digest-agent"
version = "0.1.0"
description = "Autonomous arXiv Paper Digest & QA Agent powered by LangGraph, Local Embeddings, and Gemini/Groq"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Senior AI/ML Systems Engineer" }
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.4",
    "langchain-huggingface>=0.1.2",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "pymupdf>=1.24.0",
    "arxiv>=2.1.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
arxiv-agent = "main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
